services:
  qualification:
    build: .
    env_file: .env
    command: ["listen"]
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    init: true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
